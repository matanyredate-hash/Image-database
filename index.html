<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Database</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <div>
    <h1>Image Database</h1>
    <p>ספריית התמונות שלך</p>
  </div>

  <button id="newFolderButton" class="primary-button">
    + תיקייה חדשה
  </button>
</header>

<main>

  <!-- מסך התיקיות -->
  <section id="foldersView">

    <div class="section-title">
      <h2>התיקיות שלי</h2>
      <span id="folderCount">0 תיקיות</span>
    </div>

    <div id="foldersGrid" class="folders-grid"></div>

    <div id="emptyFolders" class="empty-state">
      <div>📁</div>
      <h2>אין עדיין תיקיות</h2>
      <p>צור את התיקייה הראשונה שלך</p>
    </div>

  </section>


  <!-- מסך תיקייה -->
  <section id="folderView" class="hidden">

    <div class="folder-header">

      <button id="backButton" class="back-button">
        → חזרה
      </button>

      <div>
        <h2 id="currentFolderName"></h2>
        <span id="fileCount">0 קבצים</span>
      </div>

      <div class="folder-actions">

        <button id="autoPlayButton" class="secondary-button">
          ▶️ גלילה אוטומטית
        </button>

        <label class="primary-button upload-button">
          + הוסף קבצים
          <input
            id="fileInput"
            type="file"
            accept="image/*"
            multiple
            hidden
          >
        </label>

      </div>

    </div>

    <div id="status"></div>

    <div id="filesGrid" class="files-grid"></div>

    <div id="emptyFiles" class="empty-state">
      <div>🖼️</div>
      <h2>התיקייה ריקה</h2>
      <p>הוסף תמונות לתיקייה</p>
    </div>

  </section>

</main>


<!-- חלון יצירת תיקייה -->
<div id="folderModal" class="modal hidden">

  <div class="modal-box">

    <button id="closeModal" class="close-button">
      ×
    </button>

    <h2>תיקייה חדשה</h2>

    <input
      id="folderName"
      type="text"
      placeholder="לדוגמה: אור התקווה 6"
      autocomplete="off"
    >

    <button id="createFolder" class="primary-button full">
      צור תיקייה
    </button>

  </div>

</div>


<!-- מציג תמונה -->
<div id="viewer" class="viewer hidden">

  <button id="closeViewer" class="viewer-close">
    ×
  </button>

  <button id="previousFile" class="viewer-arrow right">
    →
  </button>

  <div class="viewer-content">

    <img id="viewerImage" src="" alt="">

    <div id="viewerName"></div>

    <div class="viewer-controls">

      <button id="viewerAutoPlay">
        ▶️
      </button>

      <button id="viewerPause">
        ⏸️
      </button>

    </div>

  </div>

  <button id="nextFile" class="viewer-arrow left">
    ←
  </button>

</div>


<script src="app.js"></script>

</body>
</html>
