<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Database</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="brand">
    <div class="logo">I</div>
    <div>
      <h1>Image Database</h1>
      <p>ספריית התמונות שלך</p>
    </div>
  </div>

  <button id="newFolderBtn" class="primary-btn">
    <span>＋</span>
    תיקייה חדשה
  </button>
</header>

<main>

  <!-- מסך תיקיות -->
  <section id="foldersPage">

    <div class="page-heading">
      <div>
        <h2>התיקיות שלך</h2>
        <p id="folderCount">0 תיקיות</p>
      </div>
    </div>

    <div id="foldersGrid" class="folders-grid"></div>

    <div id="noFolders" class="empty">
      <div class="empty-icon">📁</div>
      <h3>עדיין אין תיקיות</h3>
      <p>צור תיקייה חדשה כדי להתחיל</p>
    </div>

  </section>


  <!-- מסך תיקייה -->
  <section id="folderPage" class="hidden">

    <div class="folder-top">

      <button id="backBtn" class="back-btn">
        → תיקיות
      </button>

      <div class="folder-title">
        <h2 id="folderTitle"></h2>
        <p id="fileCount"></p>
      </div>

      <div class="actions">

        <button id="autoBtn" class="secondary-btn">
          ▶ הצגה אוטומטית
        </button>

        <label class="primary-btn upload-btn">
          ＋ הוסף קבצים
          <input
            id="fileInput"
            type="file"
            accept="image/*"
            multiple
            hidden
          >
        </label>

      </div>

    </div>

    <div id="uploadStatus" class="status"></div>

    <div id="filesGrid" class="files-grid"></div>

    <div id="noFiles" class="empty">
      <div class="empty-icon">🖼️</div>
      <h3>התיקייה ריקה</h3>
      <p>הוסף תמונות כדי להתחיל</p>
    </div>

  </section>

</main>


<!-- יצירת תיקייה -->

<div id="folderModal" class="modal hidden">

  <div class="modal-box">

    <button id="closeModal" class="modal-close">×</button>

    <div class="modal-icon">📁</div>

    <h2>תיקייה חדשה</h2>
    <p>בחר שם לתיקייה</p>

    <input
      id="folderName"
      type="text"
      placeholder="לדוגמה: אור התקווה 6"
    >

    <button id="createFolderBtn" class="primary-btn full">
      צור תיקייה
    </button>

  </div>

</div>


<!-- מציג תמונה -->

<div id="viewer" class="viewer hidden">

  <button id="closeViewer" class="viewer-close">×</button>

  <button id="prevBtn" class="viewer-arrow right">→</button>

  <div class="viewer-center">

    <img id="viewerImage" src="" alt="">

    <div id="viewerName" class="viewer-name"></div>

    <div class="viewer-controls">
      <button id="viewerPlay">▶</button>
      <button id="viewerPause">⏸</button>
    </div>

  </div>

  <button id="nextBtn" class="viewer-arrow left">←</button>

</div>


<script src="app.js"></script>

</body>
</html>
